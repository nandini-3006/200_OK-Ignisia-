<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GSTIN Credit Score Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --surface2: #1e2230;
    --border: rgba(255,255,255,0.07);
    --accent: #6c63ff;
    --accent2: #00d4aa;
    --text: #e8eaf0;
    --muted: #7a7f95;
    --danger: #ff6b6b;
    --warn: #ffa94d;
    --good: #51cf66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: auto 1fr;
  }

  /* ── Header ── */
  header {
    grid-column: 1 / -1;
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--surface);
  }
  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  header .badge {
    background: rgba(108,99,255,0.18);
    color: #a59fff;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 99px;
    border: 1px solid rgba(108,99,255,0.3);
  }

  /* ── Sidebar ── */
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1.25rem 1rem;
    overflow-y: auto;
    height: calc(100vh - 65px);
    position: sticky;
    top: 0;
  }
  aside .section-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 0.5rem;
    margin-bottom: 0.75rem;
  }
  input#search {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 0.55rem 0.85rem;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    margin-bottom: 1rem;
    transition: border-color 0.2s;
  }
  input#search:focus { border-color: var(--accent); }
  input#search::placeholder { color: var(--muted); }
  .gstin-list { display: flex; flex-direction: column; gap: 4px; }
  .gstin-item {
    padding: 0.6rem 0.85rem;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.15s;
    border: 1px solid transparent;
  }
  .gstin-item:hover { background: var(--surface2); }
  .gstin-item.active {
    background: rgba(108,99,255,0.15);
    border-color: rgba(108,99,255,0.35);
  }
  .gstin-item .gname {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
  }
  .gstin-item .gscore {
    font-size: 12px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 99px;
  }

  /* ── Main panel ── */
  main {
    padding: 2rem;
    overflow-y: auto;
    height: calc(100vh - 65px);
  }
  .panel-header {
    display: flex;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .panel-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  /* ── Score ring ── */
  .score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    min-width: 220px;
  }
  .ring-wrap { position: relative; width: 70px; height: 70px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-wrap .ring-num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    transform: none;
  }
  .score-meta .label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .score-meta .tier {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 600;
  }

  /* ── Section cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }
  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  /* ── SHAP bars ── */
  .bar-row {
    display: grid;
    grid-template-columns: 140px 1fr 48px 60px;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .bar-name { font-size: 12px; color: var(--muted); font-family: 'DM Sans', sans-serif; }
  .bar-track {
    background: rgba(255,255,255,0.06);
    border-radius: 99px;
    height: 6px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
  .bar-pct { font-size: 12px; font-weight: 500; text-align: right; }
  .bar-dir {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 99px;
    text-align: center;
    font-weight: 500;
  }
  .pos { background: rgba(81,207,102,0.15); color: #51cf66; }
  .neg { background: rgba(255,107,107,0.15); color: #ff6b6b; }

  /* ── Explanation ── */
  .explanation {
    line-height: 1.75;
    color: #c5c8d8;
    font-size: 13.5px;
    white-space: pre-wrap;
  }

  /* ── Empty state ── */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60vh;
    gap: 1rem;
    color: var(--muted);
  }
  .empty .big { font-size: 3rem; }
  .empty p { font-size: 14px; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
</style>
</head>
<body>

function scoreColor(s) {
  if (s >= 75) return 'var(--good)';
  if (s >= 45) return 'var(--warn)';
  return 'var(--danger)';
}
function scoreTier(s) {
  if (s >= 75) return ['High', 'var(--good)'];
  if (s >= 45) return ['Medium', 'var(--warn)'];
  return ['Low', 'var(--danger)'];
}

function buildSidebar(list) {
  const container = document.getElementById('gstin-list');
  container.innerHTML = '';
  list.forEach(d => {
    const [tier, col] = scoreTier(d.score);
    const el = document.createElement('div');
    el.className = 'gstin-item';
    el.dataset.gstin = d.gstin;
    el.innerHTML = `
      <span class="gname">${d.gstin}</span>
      <span class="gscore" style="background:${col}22;color:${col}">${d.score}</span>
    `;
    el.onclick = () => showGSTIN(d.gstin);
    container.appendChild(el);
  });
}

function filterList(q) {
  const filtered = DATA.filter(d => d.gstin.toLowerCase().includes(q.toLowerCase()));
  buildSidebar(filtered);
}

      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="6"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}"
        stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}"/>
    </svg>
    <div class="ring-num" style="color:${color}">${score}</div>
  `;
}

function showGSTIN(gstin) {
  document.querySelectorAll('.gstin-item').forEach(el => {
    el.classList.toggle('active', el.dataset.gstin === gstin);
  });

  const d = DATA.find(x => x.gstin === gstin);
  if (!d) return;

  const color = scoreColor(d.score);
  const [tier] = scoreTier(d.score);
  const maxPct = Math.max(...d.features.map(f => f.pct));

  const bars = d.features.map(f => {
    const w = ((f.pct / maxPct) * 100).toFixed(1);
    const isPos = f.mean_shap >= 0;
    const barColor = isPos ? 'var(--good)' : 'var(--danger)';
    return `
      <div class="bar-row">
        <div class="bar-name">${f.name}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${w}%;background:${barColor}"></div>
        </div>
        <div class="bar-pct" style="color:${barColor}">${f.pct}%</div>
        <div class="bar-dir ${isPos ? 'pos' : 'neg'}">${isPos ? '&#x25B2; pos' : '&#x25BC; neg'}</div>
      </div>`;
  }).join('');

  document.getElementById('main-panel').innerHTML = `
    <div class="panel-header">
      <div>
        <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">GSTIN</div>
        <h2>${d.gstin}</h2>
      </div>
      <div class="score-card">
        <div class="ring-wrap">${ring(d.score, color)}</div>
        <div class="score-meta">
          <div class="label">Credit Score</div>
          <div class="tier" style="color:${color}">${tier} Risk</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Top SHAP Feature Contributions</div>
      ${bars}
    </div>

    <div class="card">
      <div class="card-title">LLM Explanation</div>
      <div class="explanation">${d.explanation}</div>
    </div>
  `;
}

buildSidebar(DATA);
</script>
</body>
</html>
